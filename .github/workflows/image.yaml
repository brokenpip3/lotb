name: IMAGE

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: ["main", "develop"]
    paths:
      - 'lotb/**'
  pull_request:
    paths:
      - 'lotb/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ovverride version if needed
        run: |
          if [ "${GITHUB_EVENT_NAME}" == "release" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "OVERRIDE_VERSION=${TAG_NAME}" >> $GITHUB_ENV
          else
            echo "OVERRIDE_VERSION=0.0.0-dev" >> $GITHUB_ENV
          fi
      - name: build image
        run: nix develop . --command just docker-build
      - name: push image
        if: github.event_name != 'pull_request'
        run: nix develop . --command just docker-push
