name: IMAGE

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: ["main", "develop"]
    paths:
      - 'lotb/**'
  pull_request:
    paths:
      - 'lotb/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ovverride version if needed
        run: |
          if [ "${GITHUB_EVENT_NAME}" == "release" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "OVERRIDE_VERSION=${TAG_NAME}" >> $GITHUB_ENV
          else
            echo "OVERRIDE_VERSION=0.0.0-dev" >> $GITHUB_ENV
          fi
      - name: build image
        run: nix develop . --command just docker-build
      - name: push image
        if: github.event_name != 'pull_request'
        run: nix develop . --command just docker-push
